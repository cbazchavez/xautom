  - titulo: "62.9% de los autos nuevos vendidos en China en mayo 2026 fueron de nueva energía (BEV+PHEV)"
    fuente: "CarNewsChina"
    url: "https://carnewschina.com/2026/06/10/electric-cars-occupied-62-9-of-the-market-share-in-may-2026-in-china/"
    resumen: >
      En mayo de 2026, los vehículos de nueva energía (eléctricos de batería +
      híbridos enchufables) fueron el 62.9% de las ventas de autos nuevos en
      China. BYD lideró 2025 con >4.54M de unidades entregadas; Tesla quedó 5º en
      China (~4.9% del mercado NEV). NOTA: "nueva energía" incluye híbridos
      enchufables, no solo 100% eléctricos — usar el término correcto.
    por_que_importa: >
      Occidente sigue debatiendo "range anxiety"; en China lo eléctrico ya es el
      default del mercado. Ángulo: no es debate, es infraestructura hecha.
    pilar_sugerido: lectura_del_mundo

  - titulo: "China es prácticamente cashless: ~90% de los pagos móviles son por código QR"
    fuente: "Daxue Consulting / Wikipedia (Mobile payments in China)"
    url: "https://daxueconsulting.com/payment-methods-in-china/"
    resumen: >
      ~969M de usuarios de pago móvil (jun 2024); >85% de penetración urbana; los
      pagos móviles fueron ~73% de las transacciones en 2024 y >90% de esos pagos
      móviles se hacen por código QR. Alipay (~1B usuarios) y WeChat Pay dominan.
    por_que_importa: >
      "Tap to pay" en Occidente se vende como futuro; China lo resolvió con un QR
      hace ~una década. Observación en vivo (el puesto de comida, el templo).
    pilar_sugerido: lectura_del_mundo

