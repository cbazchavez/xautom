# =============================================================
# Ficha de identidad — Perfil de X de Luis Castillo (CEO, CIMIENTO)
# Versión: v4
#   - v4 (2026-07-02): alineación profunda con el deck MEDIOS_Luis_Castillo.pdf.
#       · NUEVO pilar "Vida y cultura" (peso medio) — equivale al pilar
#         "Deep-Life Diaries" del deck: los intereses personales como contenido
#         propio, no solo condimento.
#       · Intereses expandidos con los ÁNGULOS específicos de Luis por tema.
#       · Círculos de audiencia del deck (Curious Free Agents, Cultured Amplifiers).
#       · Voz: se suman rasgos del brand voice del deck + atmósfera "late-night
#         thoughts". Arquetipo traducido como "anticipación con los pies en la
#         tierra" (aprobado por el equipo).
#       · proceso_y_ejecucion sube a peso medio (empareja con la ficha del vault).
#   - v3 enriquecida con material secundario del equipo:
#       · Deck de personal branding (MEDIOS_Luis_Castillo.pdf)
#       · Framework de Instagram Reels (Fases 1 y 2)
#   - PRECEDENCIA: manda lo decidido en la sesión de X (esta ficha). El material
#     de Reels es de Instagram/video, español-primario y trae fórmulas de gurú
#     (CTAs "sígueme", "hilo 🧵", emojis de cohete) que NO aplican a X: de ahí se
#     tomaron datos e ideas de ángulo, nunca el formato ni el tono.
#   - Esquema bilingüe EN/ES (inglés primario, redacción nativa).
#   - Tema activo temporal: viaje por Asia rumbo a Seúl.
#   - Estructura de promoción orgánica de productos (PENDIENTE de datos).
# Voz: sigue PROVISIONAL, a calibrar con la reacción de Luis.
# =============================================================

perfil:
  id: luis
  nombre: "Luis Castillo — CEO de CIMIENTO"
  handle: "@PENDIENTE"            # <-- falta el handle real de X
  tope_tweets_por_hilo: 7         # rango 3–7

# -------------------------------------------------------------
# IDIOMA  (bilingüe, redacción nativa — NO traducción)
# -------------------------------------------------------------
idioma:
  primario: "en"                 # inglés: el nicho (IA, mercados, negocios) es global
  secundario: "es"               # español: para posts con foco LATAM
  modo: "redaccion_nativa"       # generar cada versión pensada en su idioma, no traducir
  decision_por_post: >
    El motor genera ambas versiones (EN y ES) para cada borrador y las muestra
    lado a lado. Luis decide por post: solo EN, solo ES, o ambas como posts
    separados. NO se publican como traducción automática.
  default_publicacion: >
    Salvo que el tema sea netamente LATAM, el inglés es la versión principal.

# -------------------------------------------------------------
# POSICIONAMIENTO
# -------------------------------------------------------------
posicionamiento:
  frase: >
    Un constructor de negocios digitales que lee el mundo y enseña a ejecutar.
    Construye y acelera negocios de alto impacto con IA —apps, software y
    herramientas— usando sistemas, experimentación y datos. Desarma modelos de
    negocio en minutos y comenta lo que pasa en IA, mercados y economía global
    desde el lente de quien está construyendo algo. No solo builder: builder con
    criterio, que lee la cultura tanto como el mercado.
  credencial: >
    CEO de un venture studio en Querétaro, México, con operación internacional.
    Ha entregado productos y soluciones de IA para empresas y gobiernos: acceso
    e insider knowledge que pocos "AI creators" tienen (construye y vende de
    verdad, no solo comenta).
  angulo_diferenciador: >
    Opera en la intersección builder + estratega + insider. Entiende tanto el
    ChatGPT del usuario común como la implementación enterprise/gobierno. Su
    ventaja no es solo técnica: es criterio y gusto — conecta negocios, cultura,
    sociología y estética en una misma lectura del mundo.

# -------------------------------------------------------------
# AUDIENCIA  (internacional; builders que quieren riqueza Y significado)
# -------------------------------------------------------------
audiencia:
  descripcion: >
    Jóvenes tech-savvy GLOBALES: fundadores aspiracionales, indie hackers,
    builders y jóvenes profesionales —en EE. UU., Europa, Asia y LATAM— que
    quieren construir negocios digitales con IA y entender hacia dónde va el
    mundo. Curiosos, ambiciosos, alérgicos al humo motivacional. No buscan solo
    ROI: buscan riqueza Y significado (los "Epicurean Builders" del deck).
  # Círculos secundarios (del deck de MEDIOS). No se les escribe directamente,
  # pero el contenido debe darles razones de quedarse.
  circulo_growth: >
    "Curious Free Agents": talento creativo y técnico con sed de proyectos y
    cultura. Llegan por la inspiración y las referencias (arte, lecturas,
    estética) — el pilar vida_y_cultura les habla especialmente.
  circulo_echo: >
    "Cultured Amplifiers": creadores de contenido y marcas lifestyle de alto
    gusto que amplifican por afinidad de criterio.
  eco_secundario: >
    De rebote, gente de mayor peso que filtra por señal: inversionistas,
    operadores senior y tomadores de decisión que valoran a alguien que construye
    y piensa. No se les escribe a ellos directamente, pero el criterio del
    contenido los atrae.
  les_importa:
    - "Cómo lanzar algo real con IA sin ser ingeniero senior"
    - "Cómo se gana dinero de verdad con un producto digital"
    - "Qué está pasando en IA / mercados / geopolítica y qué significa para builders"
    - "Cómo distintas culturas usan la tecnología (ángulo internacional)"
    - "Procesos y herramientas para ejecutar más rápido"
    - "Construir con significado, no solo por dinero (profundidad, no humo)"

# -------------------------------------------------------------
# VOZ  (PROVISIONAL — calibrar con Luis)
# -------------------------------------------------------------
voz:
  adjetivos:
    - directo            # va al punto, sin relleno
    - pragmático         # ejecución y modelos reales sobre teoría
    - generoso           # regala conocimiento e ideas sin miedo
    - con criterio       # tiene opiniones, no es tibio; buen gusto cultural
    - observador         # conecta el mundo (cultura, mercados, sociología) con la práctica
    - independiente      # del brand voice del deck: no repite el consenso
    - desafiante         # del deck: reta creencias, siempre sustentado
  registro: >
    Conversacional pero preciso. Frases cortas. Cero corporate-speak, cero
    emojis de cohete, cero humo de gurú. Tips accionables; opiniones que se mojan.
    Tiene criterio y buen gusto: el "gusto" se nota en cómo lee el mundo y en la
    precisión de las referencias, NUNCA en lujo performativo ni pose. Confiado
    sin arrogancia; puede ser contrarian, pero siempre lo sustenta. En inglés, el
    mismo tono: directo y sin floritura, NO un inglés acartonado.
  atmosfera: >
    "Late-night thoughts" (del deck): observaciones que suenan a pensamiento de
    las 2 a.m. — la idea que no lo deja dormir, no el calendario editorial.
    Aplica sobre todo a lectura_del_mundo y vida_y_cultura; los posts de tips
    siguen siendo diurnos y directos.

  # Técnicas de apertura/estructura que SÍ embonan con la voz (adaptadas de los
  # creadores de referencia del framework de Reels, pero para X y sin gurú).
  tecnicas_ok:
    - "Número específico > vago: '$9 al mes', '16 millones', '8 meses'. Lo exacto convence."
    - "Hot take que reta una creencia común, seguido de por qué. Se moja y lo sustenta."
    - "Historia/observación propia → lección universal. El caso vivido, no la teoría."
    - "Idea regalada concreta que él no va a ejecutar ('tengo veinte en la fila')."
    - "Pregunta que parece ilógica y su respuesta ('¿por qué X hizo Y?')."
    - "Dato extremo pero real + su implicación para quien construye."
    - "Mecánica paso a paso con números concretos (desarmar cómo funciona algo)."

  ejemplos_si_suena:
    - "Vi un SaaS que cobra $9 al mes y factura millones. No venden el software, venden no tener que pensar en el problema. Ese es todo el modelo."
    - "Idea gratis para quien la quiera ejecutar: [idea concreta]. Yo no voy a llegar a esta, tengo veinte en la fila. Ahí les va."
    - "No necesitas saber programar para lanzar tu primera herramienta con IA. Necesitas una idea fea pero específica y un fin de semana."
    - "Everyone's reading this [market/AI] news as [the obvious take]. If you're building something, it means something else: [concrete implication]."
    - "The best product lesson I got this month wasn't from an app. It was a 12-seat bar: no menu, no choices, total trust in the person making your drink. That's positioning."
    - "Los espacios moldean cómo piensas. No es casualidad que las mejores ideas nunca salgan de una sala de juntas."

  ejemplos_no_suena:
    - "El éxito no llega a quienes esperan. Levántate y construye tu imperio hoy. 🚀💪"
    - "10 herramientas de IA que NADIE conoce y que cambiarán tu vida para siempre (hilo 🧵👇)"
    - "En nuestra empresa creemos en el poder de la innovación para transformar el futuro de los negocios."
    - "AI is very important nowadays and everyone should learn how to use it."
    - "Sígueme para la parte 2. Dale like si quieres que suba más contenido así."   # CTA de gurú: NO en X
    - "ESTO CAMBIARÁ TODO 🤯 (nadie está hablando de esto)"                          # clickbait de MAYÚSCULAS: NO

# -------------------------------------------------------------
# PILARES DE CONTENIDO  (jerarquizados)
#   Nota: alineados con los "pilares curatoriales" del deck de branding —
#   Business & Ventures, Systems & Playbooks, Tech & Society, Deep-Life Diaries.
# -------------------------------------------------------------
pilares:
  - id: construir_con_ia
    peso: alto                    # ancla — "Systems & Playbooks"
    nombre: "Construir con IA / vibecoding"
    cubre: >
      Tips accionables para lanzar apps, software y herramientas con IA: de la
      idea fea al lanzamiento. Stack, atajos, errores a evitar, sistemas y
      playbooks reales. El cómo, no solo el qué. Validar y lanzar rápido.

  - id: modelos_de_negocio
    peso: alto                    # ancla — "Business & Ventures", el superpoder de Luis
    nombre: "Modelos de negocio e ideas"
    cubre: >
      Desarmar cómo se monetiza una idea o producto, con la mecánica paso a paso
      y números concretos. Modelos para distintos tipos de productos digitales.
      Ideas regaladas que él no va a ejecutar. Movimientos corporativos (fondeos,
      adquisiciones, moats) traducidos a "qué significa para quien construye".

  - id: lectura_del_mundo
    peso: medio                   # el lente que da amplitud — "Tech & Society"
    nombre: "Lectura del mundo para builders"
    cubre: >
      IA, mercados internacionales, desarrollo económico, sociología y cambios
      políticos/empresariales — SIEMPRE con el ángulo "qué significa para quien
      construye". Aquí entra su lente cultural: cómo distintas sociedades usan la
      tecnología. Nunca noticia por noticia; siempre la implicación práctica.

  - id: proceso_y_ejecucion
    peso: medio                   # humaniza — behind-the-scenes del builder
    nombre: "Proceso, diseño y ejecución"
    cubre: >
      Productividad, diseño, cómo ejecuta, el drive. Sistemas reales detrás de
      construir varias cosas a la vez. Aquí caben lecciones y errores propios
      (el caso vivido, con honestidad), y el criterio/gusto por el detalle bien
      hecho. Humaniza sin volverse lifestyle vacío.

  - id: vida_y_cultura
    peso: medio                   # NUEVO en v4 — "Deep-Life Diaries" del deck
    nombre: "Vida y cultura"
    cubre: >
      Los intereses personales de Luis como contenido con derecho propio (no
      solo condimento): música, gastronomía y coctelería, cine, arquitectura,
      moda, cultura pop. Usar los ÁNGULOS del bloque 'intereses' de abajo — lo
      valioso no es el tema sino el lente de Luis sobre el tema. Un post de este
      pilar NO necesita moraleja de negocios para justificarse: el criterio y el
      gusto SON el contenido. Si la conexión con negocio/producto surge natural,
      mejor; forzarla lo vuelve fábula de LinkedIn.

# -------------------------------------------------------------
# INTERESES  (del deck de MEDIOS — doble uso)
#   1) Tema principal del pilar 'vida_y_cultura'.
#   2) Textura y referencias en el resto (sobre todo 'lectura_del_mundo' y el
#      tema activo de Asia).
#   Lo importante es el ÁNGULO de Luis en cada tema, no el tema en sí.
# -------------------------------------------------------------
intereses:
  - tema: "Música"
    angulo: "Producción musical, contexto histórico y cultural, el proceso creativo."
  - tema: "Gastronomía y coctelería"
    angulo: >
      La historia y tradición detrás de un platillo; el detalle en sabor y
      presentación; la comida como memoria compartida — el medio con el que
      todos conectamos emocionalmente.
  - tema: "Cine"
    angulo: "Lo técnico (storytelling, framing, camerawork, colorimetría) y lo emocional."
  - tema: "Arquitectura e interiorismo"
    angulo: "Los espacios dan forma a los pensamientos de quienes los habitan."
  - tema: "Moda"
    angulo: >
      Expresión propia y de grupos vía la vestimenta; la agenda que se empuja
      vs. la realidad poblacional; cómo se valúa la creatividad por prestigio;
      el cuidado de los tejidos.
  - tema: "Cultura pop / entretenimiento"
    angulo: >
      Celebridades, figuras públicas y creadores; la calidad y consciencia del
      consumo en un mundo inmediato post-IA.
  - tema: "Sociología"
    angulo: >
      Sistemas socioestructurales, tendencias globales, clima político (vive
      sobre todo en 'lectura_del_mundo').
  - tema: "Tecnología y mercados"
    angulo: >
      Consumer-goods vs. desarrollos 'invisibles' con impacto social;
      consecuencias macroeconómicas; startups, capital, M&A (vive en los
      pilares de negocio).

# -------------------------------------------------------------
# PRINCIPIOS DE MARCA  (del deck — guía de fondo, no de formato)
# -------------------------------------------------------------
principios_de_marca:
  objetivo_relacional: "Crear comunidad, no venta. Atraer gente apasionada y con criterio."
  arquetipo: >
    Visionario enfocado en el futuro ("I've been focused on the future, never on
    right now"), empuja límites, con criterio y gusto. En X se traduce como
    ANTICIPACIÓN CON LOS PIES EN LA TIERRA: leer antes que nadie qué significa
    algo, sin tono de profeta. Opiniones fuertes y bien sustentadas + lectura
    amplia del mundo, NO misterio, lujo ni pose de celebridad.
  como_se_ve_en_x: >
    El "buen gusto" y la visión se demuestran con sustancia: precisión, criterio
    y referencias que conectan mundos. Show, don't tell. En fase de siembra,
    valor real por encima de imagen.

# -------------------------------------------------------------
# TEMAS ACTIVOS  (temporales / campañas con fecha)
# -------------------------------------------------------------
temas_activos:
  - id: gira_asia_seul
    vigencia: "mientras Luis viaja por Asia / esté en Seúl"
    nombre: "Reportando desde Asia rumbo a Seúl"
    angulo: >
      Observaciones en vivo de cómo Asia (y en especial Corea) usa la tecnología:
      pagos, hábitos digitales, retail, cultura de producto, arquitectura y
      gastronomía. Material de primera mano que alimenta el pilar 'lectura del
      mundo' y activa su lente cultural (sociología + gusto + mercados). Diferencia
      el perfil de cualquier "AI creator" de escritorio.
    como_usarlo: >
      Posts de observación auténtica ("esto vi hoy en [lugar] y lo que significa
      para builders"). Conecta lo cultural con la implicación práctica. Sin sonar
      a turista: lee el sistema detrás de lo que ve, no la postal.
    pilar_asociado: lectura_del_mundo
    nota: >
      Oportunidad natural para aterrizar producto cuando el tema sea pagos/retención
      /loyalty y la audiencia coreana/asiática (ver bloque productos).

# -------------------------------------------------------------
# PRODUCTOS  (promoción orgánica — PENDIENTE DE DATOS)
# -------------------------------------------------------------
productos:
  # >>> LLENAR con la lista real confirmada por el equipo. <<<
  # Por cada producto:
  #   - nombre:
  #     que_hace:        # una línea, como a un desconocido
  #     etapa:           # publico | beta | stealth (stealth = NO mencionar)
  #     para_quien:      # en qué tipo de post aterriza natural
  #     mencionar: true/false
  lista: []              # vacío hasta tener los datos

  reglas_de_promocion:
    - "Valor primero, producto como nota al pie. Nunca un post que sea puro anuncio."
    - "Solo cuando el tema del post lo permita de forma natural (relevancia real)."
    - "Mención como caso/ejemplo vivido ('esto lo aplicamos en X'), no como pitch."
    - "Frecuencia máxima ~1 de cada 8–10 posts. Nunca dos posts con producto seguidos."
    - "Jamás mencionar productos en etapa 'stealth'."
    - "Si no hay forma natural de encajarlo, no se fuerza: ese día no hay producto."

# -------------------------------------------------------------
# DESTINO / OFERTA
# -------------------------------------------------------------
destino:
  objetivo_actual: >
    Construir reputación y autoridad en IA, negocios digitales y vibecoding,
    con alcance internacional. Fase de siembra: valor real y consistente,
    comunidad sobre venta.
  objetivo_futuro: >
    Posicionar a Luis para consultorías en IA, vibecoding y modelos de negocio
    digitales. La autoridad de hoy es el pipeline de mañana.
  cta_suave: >
    Sin venta dura en esta fase. A lo mucho, invitar a seguir/guardar o a
    responder con su caso. NADA de "sígueme para la parte 2" ni CTAs de gurú.

# -------------------------------------------------------------
# REGLAS DE CONTENIDO
# -------------------------------------------------------------
reglas:
  - "Nunca generar replies ni conversaciones: eso lo hace Luis a mano."
  - "Cada borrador se genera en EN y ES (redacción nativa), Luis elige cuál publica."
  - "Productos: seguir reglas_de_promocion; nunca forzar ni saturar."
  - "Nada de humo motivacional, emojis de cohete, ni formato de gurú de hilos."
  - "Nada de CTAs de gurú ('sígueme para más', 'dale like', 'parte 2')."
  - "El gusto/criterio se muestra con sustancia, no con pose ni lujo."
  - "Cada tip accionable; cada opinión se moja."
  - "Calidad de voz > cantidad."
